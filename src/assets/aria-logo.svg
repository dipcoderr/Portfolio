<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0118;stop-opacity:1" />
    </radialGradient>

    <!-- Purple-blue glow gradient for ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>

    <!-- Inner core gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e879f9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.8" />
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)" />

  <!-- Outer decorative dots ring -->
  <circle cx="100" cy="18" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="145" cy="30" r="2.5" fill="#6366f1" opacity="0.6"/>
  <circle cx="174" cy="62" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="182" cy="100" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="174" cy="138" r="2" fill="#6366f1" opacity="0.5"/>
  <circle cx="145" cy="170" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="100" cy="182" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="55" cy="170" r="2.5" fill="#6366f1" opacity="0.6"/>
  <circle cx="26" cy="138" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="18" cy="100" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="26" cy="62" r="2" fill="#6366f1" opacity="0.5"/>
  <circle cx="55" cy="30" r="2.5" fill="#38bdf8" opacity="0.6"/>

  <!-- Spinning outer ring (arc) -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="200 320" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="80 440" stroke-dashoffset="260" stroke-linecap="round" opacity="0.5" />

  <!-- Middle ring -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4" stroke-dasharray="30 20" />

  <!-- Core glowing circle -->
  <circle cx="100" cy="100" r="52" fill="url(#coreGrad)" opacity="0.15" />
  <circle cx="100" cy="100" r="44" fill="url(#coreGrad)" opacity="0.2" filter="url(#softGlow)" />

  <!-- Neural network nodes -->
  <circle cx="100" cy="62" r="4" fill="#e879f9" filter="url(#glow)" />
  <circle cx="130" cy="80" r="3.5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="138" cy="112" r="3" fill="#6366f1" filter="url(#glow)" />
  <circle cx="118" cy="136" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="82" cy="136" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="62" cy="112" r="3" fill="#6366f1" filter="url(#glow)" />
  <circle cx="70" cy="80" r="3.5" fill="#a855f7" filter="url(#glow)" />

  <!-- Neural network connecting lines -->
  <line x1="100" y1="62" x2="130" y2="80" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="80" x2="138" y2="112" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
  <line x1="138" y1="112" x2="118" y2="136" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <line x1="118" y1="136" x2="82" y2="136" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <line x1="82" y1="136" x2="62" y2="112" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
  <line x1="62" y1="112" x2="70" y2="80" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="70" y1="80" x2="100" y2="62" stroke="#e879f9" stroke-width="1" opacity="0.4"/>
  <!-- Cross connections -->
  <line x1="100" y1="62" x2="100" y2="100" stroke="#e879f9" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="80" x2="100" y2="100" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  <line x1="70" y1="80" x2="100" y2="100" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  <line x1="138" y1="112" x2="100" y2="100" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
  <line x1="62" y1="112" x2="100" y2="100" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>

  <!-- Center pulse dot -->
  <circle cx="100" cy="100" r="10" fill="#e879f9" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="100" cy="100" r="6" fill="#f0abfc" filter="url(#glow)" />
  <circle cx="100" cy="100" r="3" fill="#ffffff" />

  <!-- Letter A — stylish, centered -->
  <text
    x="100"
    y="107"
    font-family="'Segoe UI', 'Inter', Arial, sans-serif"
    font-size="38"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#glow)"
    opacity="0.0"
  >A</text>

  <!-- ARIA wordmark at bottom -->
  <text
    x="100"
    y="162"
    font-family="'Segoe UI', 'Inter', Arial, sans-serif"
    font-size="13"
    font-weight="700"
    fill="url(#ringGrad)"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#glow)"
  >ARIA</text>

  <!-- Tagline -->
  <text
    x="100"
    y="175"
    font-family="'Segoe UI', 'Inter', Arial, sans-serif"
    font-size="6"
    fill="#94a3b8"
    text-anchor="middle"
    letter-spacing="2"
  >AI ASSISTANT</text>
</svg>
